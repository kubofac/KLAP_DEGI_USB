<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLAP_DEGI_USB - PRECISION V4.6</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        :root { 
            --hrc-red: #E4002B; --hrc-blue: #004098; --hrc-white: #ffffff; 
            --bg-dark: #000000; --hrc-orange: #FFA500;
        }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--bg-dark); color: var(--hrc-white); 
            font-family: 'Arial Black', sans-serif; overflow: hidden; 
        }
        #dashboard { position: relative; display: flex; flex-direction: column; height: 100dvh; width: 100vw; }
        #canvas { position: absolute; top: 0; left: 0; width: 100% !important; height: calc(100% - 60px) !important; z-index: 1; }
        
        .main-ui-container {
            position: absolute; right: 10px; top: 120px; bottom: 70px; 
            display: flex; align-items: flex-start; gap: 45px; z-index: 20; pointer-events: auto;
        }
        #info-overlay { display: flex; flex-direction: column; align-items: flex-end; text-align: right; gap: 10px; }
        #rpm_val { font-size: 13vh; font-weight: 900; line-height: 0.8; margin-top: 10px; text-shadow: 3px 3px 12px #000; }
        #display1 { font-size: 18vh; font-weight: 900; line-height: 0.9; color: var(--hrc-white); text-shadow: 4px 4px 15px #000; }
        #display { font-size: 4vh; color: #bbb; text-shadow: 1px 1px 6px #000; }

        .right-panels { display: flex; flex-direction: row; gap: 15px; height: 100%; align-items: flex-start; }
        #lap-panel { width: 175px; height: 100%; display: flex; flex-direction: column; overflow: hidden; border-top: 2px solid #333; }
        #lap { flex: 1; overflow-y: auto; scrollbar-width: none; }
        #lap::-webkit-scrollbar { display: none; }
        .lap-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 18px; font-weight: 900; }
        .best-lap { color: var(--hrc-red); }

        .data-panel { display: flex; flex-direction: column; gap: 15px; width: 110px; }
        .data-box { display: flex; flex-direction: column; align-items: flex-end; }
        .label { font-size: 11px; color: var(--hrc-red); font-weight: bold; }
        .val { font-size: 40px; font-weight: 900; line-height: 0.9; }

        /* History Page */
        #history-page {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 1000; display: none;
            flex-direction: column; padding: 20px; box-sizing: border-box;
        }
        .history-content { flex: 1; overflow-y: auto; margin-bottom: 20px; }
        .history-table { width: 100%; border-collapse: collapse; font-size: 16px; }
        .history-table th, .history-table td { border: 1px solid #444; padding: 12px; text-align: center; }
        .history-table th { background: #222; color: var(--hrc-red); }
        .close-btn { 
            background: var(--hrc-red); color: white; text-align: center; 
            padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer;
        }

        footer { 
            height: 55px; display: flex; gap: 4px; padding: 4px; background: #000; border-top: 1px solid #333; 
            z-index: 100; position: fixed; bottom: 0; left: 0; right: 0;
        }
        button { flex: 1; background: #1a1a1a; color: #fff; border: 1px solid #444; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; }
        button.waiting { background: var(--hrc-orange) !important; color: #000 !important; }
        button.active { background: var(--hrc-red) !important; color: #fff !important; }
        #saveLogBtn { background: #28a745; display: none; }
    </style>
</head>
<body>

<div id="dashboard">
    <canvas id="canvas"></canvas>
    <div class="main-ui-container">
        <div id="info-overlay">
            <div id="rpm_val">0</div>
            <div id="display1">00:00.000</div>
            <div id="display">TOTAL 00:00.000</div>
        </div>
        <div class="right-panels">
            <div id="lap-panel"><div id="lap"></div></div>
            <div class="data-panel">
                <div class="data-box"><div class="label">SPEED</div><div class="val" id="speed_val">0</div></div>
                <div class="data-box"><div class="label">MAX</div><div class="val" id="max_speed_val" style="color: #FFA500;">0</div></div>
                <div class="data-box"><div class="label">TEMP</div><div class="val" id="temp_val">--</div></div>
            </div>
        </div>
    </div>
    <footer>
        <button id="usbGpsBtn">USB GPS</button>
        <button id="btConnect">BLE START</button>
        <button id="startBtn">TIMER</button>
        <button id="lapBtn">LAP/RESET</button>
        <button id="historyBtn">HISTORY</button>
        <button id="saveLogBtn">LOG SAVE</button>
        <button id="reloadBtn">RELOAD</button>
    </footer>
</div>

<!-- History Page -->
<div id="history-page">
    <h2 style="text-align: center; color: var(--hrc-red);">SESSION HISTORY</h2>
    <div class="history-content">
        <table class="history-table">
            <thead>
                <tr>
                    <th>LAP</th>
                    <th>TIME</th>
                    <th>MAX SPD</th>
                    <th>MAX RPM</th>
                </tr>
            </thead>
            <tbody id="history-body"></tbody>
        </table>
    </div>
    <div class="close-btn" onclick="
        document.getElementById('history-page').style.display='none';
        document.getElementById('historyBtn').classList.remove('active');
    ">CLOSE HISTORY</div>
</div>

<script>
'use strict';

const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b", PULSE_UUID = "f4deb353-a4cf-4ffb-badb-2a5f2e3bb630";
let targetRPM = 0, displayedRPM = 0, currentTemp = 0, maxRpmInLap = 0;
let device = null, nmeaBuffer = '', lastPos = null;
let LAP_LINE_P1 = { lat: 0, lon: 0 }, LAP_LINE_P2 = { lat: 0, lon: 0 };
let detectedDirection = null; 
let swState = 0, startTime = 0, lapStartTime = 0, lapRecords = [];
let lastUsbDataTime = 0, lastBleDataTime = 0, isGpsFixed = false;
let usbWaiting = false, bleWaiting = false, isFrozen = false;
let freezeDisplayTime = "", freezeStartTime = 0, lastLapTime = 0;
let currentSpeedKmh = 0, maxSpeed = 0, sessionMaxSpeed = 0;
let trackLogs = [], currentLapLog = [];

const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');

// --- 1. 数学的判定ロジック ---
function getIntersectionTime(p1, p2) {
    if (!LAP_LINE_P1.lat || !LAP_LINE_P2.lat) return null;
    const x1 = p1.lon, y1 = p1.lat, x2 = p2.lon, y2 = p2.lat;
    const x3 = LAP_LINE_P1.lon, y3 = LAP_LINE_P1.lat, x4 = LAP_LINE_P2.lon, y4 = LAP_LINE_P2.lat;
    const den = (y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1);
    if (Math.abs(den) < 1e-12) return null;
    const t = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / den;
    const u = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / den;
    if (t >= 0 && t <= 1) {
        const Lx = x4 - x3, Ly = y4 - y3, Vx = x2 - x1, Vy = y2 - y1;
        const currentMoveDir = (Lx * Vy - Ly * Vx) > 0 ? 1 : -1;
        if (detectedDirection === null) detectedDirection = currentMoveDir;
        if (currentMoveDir === detectedDirection && u >= -0.2 && u <= 1.2) {
            return p1.time + (p2.time - p1.time) * t; 
        }
    }
    return null;
}

// --- 2. 通信・解析ロジック ---
function dmmToDec(dmm, dir) { 
    if(!dmm || dmm.indexOf('.') === -1) return 0;
    const dot = dmm.indexOf('.'); 
    const d = parseInt(dmm.substring(0, dot-2)), m = parseFloat(dmm.substring(dot-2)); 
    let dec = d + (m/60); return (dir === 'S' || dir === 'W') ? -dec : dec; 
}

async function startUsbGps() {
    try {
        device = await navigator.usb.requestDevice({ filters: [] });
        await device.open(); usbWaiting = true;
        if (device.configuration === null) await device.selectConfiguration(1);
        await device.claimInterface(parseInt(localStorage.getItem('usb_interface')) || 1);
        while (device) {
            const result = await device.transferIn(parseInt(localStorage.getItem('usb_endpoint')) || 2, 512);
            const lines = (nmeaBuffer + new TextDecoder().decode(result.data)).split(/\r?\n/);
            nmeaBuffer = lines.pop(); lines.forEach(parseNMEA);
        }
    } catch (e) { console.error(e); usbWaiting = false; }
}

async function ble() {
    try {
        const bleDevice = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE_UUID] }] });
        bleWaiting = true;
        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        const pC = await service.getCharacteristic(PULSE_UUID);
        await pC.startNotifications();
        pC.oncharacteristicvaluechanged = (e) => {
            lastBleDataTime = Date.now();
            const data = e.target.value;
            targetRPM = (data.getUint16(0, true) * 60) / (parseInt(localStorage.getItem('pl1')) || 1);
            currentTemp = data.getUint8(2);
            document.getElementById('temp_val').textContent = currentTemp;
        };
        bleWaiting = false;
    } catch (e) { console.error(e); bleWaiting = false; }
}

function onDisconnected(event) {
    setTimeout(() => ble(), 2000);
}

function parseNMEA(line) {
    const p = line.split(',');
    if (line.includes('RMC') && p[2] === 'A') {
        isGpsFixed = true; lastUsbDataTime = Date.now(); 
        currentSpeedKmh = parseFloat(p[7]) * 1.852;
        if (currentSpeedKmh > maxSpeed) {
            maxSpeed = Math.round(currentSpeedKmh);
            if (maxSpeed > sessionMaxSpeed) sessionMaxSpeed = maxSpeed;
        }
        document.getElementById('speed_val').textContent = Math.round(currentSpeedKmh);
    }
    if (line.includes('GGA') && p[6] !== '0' && p[6] !== '') {
        isGpsFixed = true; lastUsbDataTime = Date.now(); 
        const cur = { 
            lat: dmmToDec(p[2], p[3]), lon: dmmToDec(p[4], p[5]), time: Date.now(),
            speed: currentSpeedKmh || 0, rpm: targetRPM || 0, temp: currentTemp || 0
        };
        if (swState === 1) {
            currentLapLog.push(cur);
            if (lastPos && LAP_LINE_P1.lat !== 0) {
                const intersectionTime = getIntersectionTime(lastPos, cur);
                if (intersectionTime !== null) {
                    const timeSinceLastLap = intersectionTime - lastLapTime;
                    const coolDown = parseFloat(localStorage.getItem('lapCoolDownTime')) || 30000;
                    if (timeSinceLastLap >= coolDown) processLap(intersectionTime, true);
                }
            }
        }
        lastPos = cur; 
    }
}

// --- 3. ラップ管理・描画 ---
function processLap(exactTime, useFreeze) {
    const lapTime = exactTime - (lapStartTime || startTime);
    if (lapTime <= 0) return;

    // 保存データの構成
    const lapData = {
        time: lapTime,
        maxSpeed: maxSpeed,
        maxRpm: Math.round(maxRpmInLap)
    };
    lapRecords.unshift(lapData);
    trackLogs.push([...currentLapLog]);
    
    currentLapLog = [];
    const finishedLapMaxSpeed = maxSpeed; 
    maxSpeed = 0;
    maxRpmInLap = 0; // 次のラップのためにリセット
    
    lapStartTime = exactTime; lastLapTime = exactTime;
    
    // UI更新
    const d = document.getElementById('lap'); d.innerHTML = "";
    const best = Math.min(...lapRecords.map(r => r.time));
    lapRecords.forEach((r, i) => {
        const row = document.createElement('div'); row.className = `lap-row ${r.time === best ? 'best-lap' : ''}`;
        row.innerHTML = `<span>L${lapRecords.length-i}</span><span>${timeFormat(r.time)}</span>`; d.appendChild(row);
    });

    if (useFreeze) { 
        isFrozen = true; freezeDisplayTime = timeFormat(lapTime); 
        document.getElementById('max_speed_val').textContent = finishedLapMaxSpeed;
        document.getElementById('max_speed_val').style.color = (finishedLapMaxSpeed >= sessionMaxSpeed) ? "#E4002B" : "#ffffff";
        freezeStartTime = Date.now(); 
    }
    if (window.navigator.vibrate) window.navigator.vibrate([100, 50, 100]);
}

function timeFormat(ms) { 
    let m = Math.floor(ms/60000), s = Math.floor((ms%60000)/1000), mss = Math.floor(ms%1000); 
    return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}.${mss.toString().padStart(3,'0')}`; 
}

function mainLoop() {
    const now = Date.now();
    
    // 1. RPM補間処理
    const diff = targetRPM - displayedRPM;
    displayedRPM += diff * 0.15;
    if (targetRPM > maxRpmInLap) maxRpmInLap = targetRPM;

    // 2. タイマー更新
    if (swState === 1) {
        document.getElementById('display').textContent = "TOTAL " + timeFormat(now - startTime);
        const d1 = document.getElementById('display1');
        if (isFrozen) {
            d1.textContent = freezeDisplayTime;
            if (now - freezeStartTime > 15000) isFrozen = false;
        } else {
            d1.textContent = timeFormat(now - lapStartTime);
            document.getElementById('max_speed_val').textContent = maxSpeed;
        }
    }

    // 3. 描画
    drawTacho(displayedRPM);
    requestAnimationFrame(mainLoop);
}

function drawTacho(rpm) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const w = canvas.width, h = canvas.height, segments = 75;
    const activeThreshold = (rpm / 14000) * segments; 
    const sX = 20, hY = 80, bY = h - 20, rad = bY - hY, curveEnd = 30;

    for (let i = 0; i < segments; i++) {
        let x, y, ang, prog;
        if (i <= curveEnd) {
            prog = i / curveEnd; ang = Math.PI + (prog * (Math.PI / 2)); 
            x = sX + rad + Math.cos(ang) * rad; y = hY + rad + Math.sin(ang) * rad;
        } else {
            prog = (i - curveEnd) / (segments - curveEnd); 
            x = (sX + rad) + (prog * (w - 15 - (sX + rad))); y = hY; ang = 1.5 * Math.PI;
        }

        let color = "#222"; 
        if (i < activeThreshold) {
            const curRpm = (i / segments) * 14000;
            if (curRpm >= 10500) color = "#E4002B";
            else if (curRpm >= 6000) color = "#004098";
            else color = "#ffffff";
        }

        ctx.fillStyle = color;
        ctx.save(); ctx.translate(x, y); ctx.rotate(ang + Math.PI / 2);
        ctx.fillRect(-5, -23, 10, 46); ctx.restore();

        if (i % 10 === 0 || i === segments - 1) {
            ctx.save();
            ctx.fillStyle = (i < activeThreshold) ? "#fff" : "#444";
            ctx.font = "italic bold 22px Arial"; ctx.textAlign = "center";
            ctx.fillText(Math.round((i / segments) * 14), x + Math.cos(ang) * 45, y + Math.sin(ang) * 45);
            ctx.restore();
        }
    }
    document.getElementById('rpm_val').textContent = Math.floor(rpm);
}

// --- 4. ログ出力・履歴 ---
function exportGPX() {
    if (trackLogs.length === 0 && currentLapLog.length === 0) return;
    const allPoints = [];
    trackLogs.forEach(lap => allPoints.push(...lap));
    if (currentLapLog.length > 0) allPoints.push(...currentLapLog);
    const getL = () => localStorage.getItem('startLineP1Lat') ? `${localStorage.getItem('startLineP1Lat')},${localStorage.getItem('startLineP1Lon')},${localStorage.getItem('startLineP2Lat')},${localStorage.getItem('startLineP2Lon')}` : "NOT_SET";
    
    let gpx = `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="KLAP_DEGI" xmlns="http://www.topografix.com/GPX/1/1" xmlns:gpxtpx="http://www.garmin.com/xmlschemas/TrackPointExtension/v1"><metadata><desc>SL:${getL()}</desc></metadata><trk><trkseg>`;
    const base = allPoints[0].time;
    allPoints.forEach(p => { 
        const rTime = new Date(946684800000 + (p.time - base)).toISOString();
        gpx += `<trkpt lat="${p.lat}" lon="${p.lon}"><time>${rTime}</time><speed>${(p.speed/3.6).toFixed(2)}</speed><extensions><gpxtpx:TrackPointExtension><gpxtpx:hr>${Math.round(p.rpm)}</gpxtpx:hr><gpxtpx:atemp>${p.temp}</gpxtpx:atemp></gpxtpx:TrackPointExtension></extensions></trkpt>`; 
    });
    gpx += `</trkseg></trk></gpx>`;
    const blob = new Blob([gpx], { type: 'application/gpx+xml' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `RaceLog_${Date.now()}.gpx`; a.click();
}

// 履歴ボタン
document.getElementById('historyBtn').onclick = () => {
    const page = document.getElementById('history-page');
    const body = document.getElementById('history-body');
    const btn = document.getElementById('historyBtn');
    
    body.innerHTML = "";
    btn.classList.add('active');

    if (lapRecords.length === 0) {
        body.innerHTML = "<tr><td colspan='4'>NO DATA</td></tr>";
    } else {
        const bestT = Math.min(...lapRecords.map(r => r.time));
        const bestS = Math.max(...lapRecords.map(r => r.maxSpeed));
        const bestR = Math.max(...lapRecords.map(r => r.maxRpm));

        lapRecords.forEach((r, i) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>L${lapRecords.length - i}</td>
                <td style="color:${r.time === bestT ? 'var(--hrc-red)' : '#fff'}">${timeFormat(r.time)}</td>
                <td style="color:${r.maxSpeed === bestS ? 'var(--hrc-orange)' : '#fff'}">${r.maxSpeed}</td>
                <td style="color:${r.maxRpm === bestR ? 'var(--hrc-red)' : '#fff'}">${r.maxRpm}</td>
            `;
            body.appendChild(row);
        });
    }
    page.style.display = 'flex';
};

setInterval(() => {
    const now = Date.now();
    document.getElementById('usbGpsBtn').className = (now - lastUsbDataTime < 1500 && isGpsFixed) ? 'active' : (usbWaiting ? 'waiting' : '');
    document.getElementById('btConnect').className = (now - lastBleDataTime < 1500) ? 'active' : (bleWaiting ? 'waiting' : '');
    const p1 = localStorage.getItem('startLineP1Lat'), p2 = localStorage.getItem('startLineP2Lat');
    const reloadBtn = document.getElementById('reloadBtn');
    if (!p1 || !p2) { reloadBtn.className = 'waiting'; reloadBtn.textContent = 'SET LINE!'; }
    else { reloadBtn.className = ''; reloadBtn.textContent = 'RELOAD'; }
}, 1000);

document.getElementById('usbGpsBtn').onclick = startUsbGps;
document.getElementById('btConnect').onclick = ble;
document.getElementById('saveLogBtn').onclick = exportGPX;
document.getElementById('startBtn').onclick = () => {
    if (swState !== 1) {
        swState = 1; startTime = Date.now(); lapStartTime = startTime; lastLapTime = startTime;
        trackLogs = []; currentLapLog = []; lastPos = null; maxRpmInLap = 0;
        document.getElementById('startBtn').classList.add('active');
        document.getElementById('saveLogBtn').style.display = 'none';
    } else {
        swState = 2; document.getElementById('startBtn').classList.remove('active');
        document.getElementById('saveLogBtn').style.display = 'block';
    }
};
document.getElementById('lapBtn').onclick = () => { 
    if(swState === 1) processLap(Date.now(), false); 
    else { 
        swState = 0; lapRecords = []; trackLogs = []; currentLapLog = []; maxSpeed = 0; sessionMaxSpeed = 0; lastPos = null; detectedDirection = null;
        document.getElementById('max_speed_val').textContent = "0";
        document.getElementById('lap').innerHTML = ""; 
        document.getElementById('display1').textContent = "00:00.000"; 
        document.getElementById('display').textContent = "TOTAL 00:00.000";
    }
};
document.getElementById('reloadBtn').onclick = () => location.reload();

window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight - 60; };
window.onload = () => { 
    window.dispatchEvent(new Event('resize')); 
    const p1Lat = localStorage.getItem('startLineP1Lat');
    if (p1Lat) {
        LAP_LINE_P1 = { lat: parseFloat(p1Lat), lon: parseFloat(localStorage.getItem('startLineP1Lon')) };
        LAP_LINE_P2 = { lat: parseFloat(localStorage.getItem('startLineP2Lat')), lon: parseFloat(localStorage.getItem('startLineP2Lon')) };
    }
    mainLoop();
};
</script>
</body>
</html>
